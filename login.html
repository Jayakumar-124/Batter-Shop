<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hesha Premium</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="logo.png" type="image/png">
</head>

<body class="login-body">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Home</a>
                <h1 class="logo">HESHA</h1>
                <p>Welcome back! Please login to your account.</p>
            </div>

            <form class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="example@mail.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="*********" required>
                        <i class="fa-solid fa-eye password-toggle" title="Show Password"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary login-btn">Login</button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="signup.html">Create Account</a></p>

                <div class="social-login">
                    <span>Or login with</span>
                    <div class="social-icons">
                        <a href="#"><i class="fa-brands fa-google"></i></a>
                        <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api';

        document.querySelector('.login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Store the real user data from the database
                    localStorage.setItem('hesha_user', JSON.stringify(result));
                    alert('Login Successful! Welcome to Hesha.');
                    window.location.href = 'profile.html';
                } else {
                    alert('Login Error: ' + (result.detail || 'Invalid credentials'));
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('Connection to backend failed. Make sure the server is running.');
            }
        });
    </script>
    <script src="main.js"></script>
</body>

</html>
