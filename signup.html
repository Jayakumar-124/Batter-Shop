<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Hesha Premium</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="icon" href="logo.png" type="image/png">
</head>

<body class="login-body">
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <a href="login.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Login</a>
                <h1 class="logo">HESHA</h1>
                <p>Join the Hesha family. Create your account today!</p>
            </div>

            <form class="signup-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="fullname" placeholder="Your Name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Your@mail.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="*********" required>
                        <i class="fa-solid fa-eye password-toggle" title="Show Password"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirm-password" placeholder="*********" required>
                        <i class="fa-solid fa-eye password-toggle" title="Show Password"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" required>
                        I agree to the <a href="#"
                            style="color: var(--primary); font-weight: 500; font-size: inherit;">Terms & Conditions</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary login-btn">Create Account</button>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a href="login.html">Login</a></p>

                <div class="social-login">
                    <span>Or sign up with</span>
                    <div class="social-icons">
                        <a href="#"><i class="fa-brands fa-google"></i></a>
                        <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api';

        document.querySelector('.signup-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Account created successfully! Welcome to Hesha.');
                    // Automatically log them in or redirect to login
                    window.location.href = 'login.html';
                } else {
                    alert('Signup Error: ' + (result.detail || 'Something went wrong'));
                }
            } catch (error) {
                console.error('Network Error:', error);
                alert('Connection to backend failed. Make sure the server is running.');
            }
        });
    </script>
    <script src="main.js"></script>
</body>

</html>
